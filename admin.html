<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Orders - PetAura</title>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
    import {
      getFirestore,
      collection,
      onSnapshot,
      updateDoc,
      doc
    } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "petaura-efbc9.firebaseapp.com",
      projectId: "petaura-efbc9",
      storageBucket: "petaura-efbc9.appspot.com",
      messagingSenderId: "113061782428",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const container = document.getElementById("orders");

    // 🔥 LIVE ORDERS
    onSnapshot(collection(db, "orders"), (snapshot) => {

      container.innerHTML = "";

      snapshot.forEach((docSnap) => {
        const order = docSnap.data();

        container.innerHTML += `
          <div class="card">
            <h3>💰 Total: $${order.total}</h3>

            <p><b>Status:</b> ${order.status}</p>

            <pre>${JSON.stringify(order.items, null, 2)}</pre>

            <button onclick="markShipped('${docSnap.id}')">
              Mark as Shipped
            </button>
          </div>
        `;
      });
    });

    // 🔥 Change status
    window.markShipped = async function(id){
      await updateDoc(doc(db, "orders", id), {
        status: "shipped"
      });
    }

  </script>

  <style>
    body{
      font-family: Arial;
      background:#f5f5f5;
      padding:20px;
    }

    h1{
      text-align:center;
    }

    .card{
      background:#fff;
      padding:20px;
      margin:15px auto;
      border-radius:15px;
      max-width:600px;
      box-shadow:0 10px 30px rgba(0,0,0,0.08);
    }

    button{
      margin-top:10px;
      padding:10px 15px;
      border:none;
      border-radius:10px;
      background:black;
      color:white;
      cursor:pointer;
    }

    pre{
      background:#f0f0f0;
      padding:10px;
      border-radius:10px;
      overflow:auto;
    }
  </style>
</head>

<body>

  <h1>📦 Live Orders Dashboard</h1>

  <div id="orders"></div>

</body>
</html>
