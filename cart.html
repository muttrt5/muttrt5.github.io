<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Your Cart | PetAura™</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body{
      font-family:'Poppins',sans-serif;
      background:#F6F3EE;
    }
  </style>
</head>

<body>

  <div class="max-w-4xl mx-auto px-6 py-20">

    <h1 class="text-4xl font-bold mb-10 text-center">Your Cart 🛒</h1>

    <div id="cart-items" class="space-y-6"></div>

    <div class="mt-10 bg-white p-6 rounded-2xl border">
      <h2 class="text-2xl font-bold mb-4">Total</h2>
      <p id="total" class="text-xl font-semibold">$0.00</p>

      <button class="mt-6 w-full bg-black text-white py-3 rounded-full">
        Checkout
      </button>
    </div>

  </div>

  <script>
    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    const container = document.getElementById("cart-items");
    const totalEl = document.getElementById("total");

    function renderCart() {
      container.innerHTML = "";
      let total = 0;

      cart.forEach((item, index) => {
        total += item.price;

        container.innerHTML += `
          <div class="bg-white p-5 rounded-2xl border flex justify-between items-center">
            <div>
              <h3 class="font-semibold">${item.name}</h3>
              <p class="text-gray-500">$${item.price}</p>
            </div>

            <button onclick="removeItem(${index})" class="text-red-500">
              Remove
            </button>
          </div>
        `;
      });

      totalEl.innerText = "$" + total.toFixed(2);
    }

    function removeItem(index){
      cart.splice(index,1);
      localStorage.setItem("cart", JSON.stringify(cart));
      renderCart();
    }

    renderCart();
  </script>

</body>
</html>
