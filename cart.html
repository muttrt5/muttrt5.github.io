<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cart | PetAura™</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body{
      font-family:'Poppins',sans-serif;
      background:#F6F3EE;
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header class="bg-white border-b border-[#e9dfd2]">
    <div class="max-w-6xl mx-auto px-6 py-6 flex justify-between items-center">
      <h1 class="text-2xl font-bold">🛒 Your Cart</h1>
      <a href="index.html" class="text-sm text-gray-500 hover:text-black">
        ← Continue Shopping
      </a>
    </div>
  </header>

  <!-- CONTENT -->
  <main class="max-w-6xl mx-auto px-6 py-14 grid lg:grid-cols-3 gap-10">

    <!-- ITEMS -->
    <section class="lg:col-span-2 space-y-5">

      <div id="cart-items" class="space-y-5"></div>

      <div id="empty" class="hidden text-center py-20 text-gray-500">
        Your cart is empty 🐾
      </div>

    </section>

    <!-- SUMMARY -->
    <aside class="bg-white p-8 rounded-3xl border h-fit">

      <h2 class="text-2xl font-bold mb-6">Order Summary</h2>

      <div class="flex justify-between mb-4 text-gray-600">
        <span>Subtotal</span>
        <span id="subtotal">$0.00</span>
      </div>

      <div class="flex justify-between mb-4 text-gray-600">
        <span>Shipping</span>
        <span>Free</span>
      </div>

      <div class="border-t pt-4 flex justify-between font-bold text-lg">
        <span>Total</span>
        <span id="total">$0.00</span>
      </div>

      <button class="w-full mt-6 bg-black text-white py-3 rounded-full">
        Checkout
      </button>

    </aside>

  </main>

  <!-- SCRIPT -->
  <script>

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    const container = document.getElementById("cart-items");
    const empty = document.getElementById("empty");
    const subtotalEl = document.getElementById("subtotal");
    const totalEl = document.getElementById("total");

    function renderCart() {
      container.innerHTML = "";

      let total = 0;

      if(cart.length === 0){
        empty.classList.remove("hidden");
      } else {
        empty.classList.add("hidden");
      }

      cart.forEach((item, index) => {

        if(!item.qty){
          item.qty = 1;
        }

        total += item.price * item.qty;

        container.innerHTML += `
          <div class="bg-white p-6 rounded-3xl border flex justify-between items-center">

            <div>
              <h3 class="text-lg font-semibold">${item.name}</h3>
              <p class="text-gray-500">$${item.price.toFixed(2)}</p>

              <!-- QUANTITY -->
              <div class="flex items-center gap-3 mt-3">

                <button onclick="decreaseQty(${index})"
                  class="w-8 h-8 bg-gray-200 rounded-full">
                  -
                </button>

                <span class="font-semibold">${item.qty}</span>

                <button onclick="increaseQty(${index})"
                  class="w-8 h-8 bg-gray-200 rounded-full">
                  +
                </button>

              </div>
            </div>

            <div class="text-right">

              <span class="font-semibold text-lg">
                $${(item.price * item.qty).toFixed(2)}
              </span>

              <br>

              <button onclick="removeItem(${index})"
                class="text-red-500 text-sm hover:underline mt-3">
                Remove
              </button>

            </div>

          </div>
        `;
      });

      subtotalEl.innerText = "$" + total.toFixed(2);
      totalEl.innerText = "$" + total.toFixed(2);

      localStorage.setItem("cart", JSON.stringify(cart));
    }

    function increaseQty(index){
      cart[index].qty += 1;
      renderCart();
    }

    function decreaseQty(index){
      if(cart[index].qty > 1){
        cart[index].qty -= 1;
      } else {
        cart.splice(index, 1);
      }
      renderCart();
    }

    function removeItem(index){
      cart.splice(index, 1);
      renderCart();
    }

    renderCart();

  </script>

</body>
</html>
